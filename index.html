<style>
@import url('https://fonts.googleapis.com/css2?family=Scheherazade+New:wght@400&display=swap');
:root{ --bg:#002b36; --panel:#073642; --text:#eee8d5; --muted:#93a1a1; --primary:#268bd2; --primary2:#2aa198; --border:color-mix(in srgb, var(--text) 18%, transparent); --option-bg:color-mix(in srgb, var(--panel) 88%, var(--primary) 12%); --option-hover:color-mix(in srgb, var(--panel) 80%, var(--primary) 20%); --option-active:color-mix(in srgb, var(--panel) 72%, var(--primary) 28%); --radius:16px; --app-font:'Scheherazade New', Scheherazade, serif; }
body{ margin:0; font-family:var(--app-font); background:var(--bg); color:var(--text); min-height:100vh; display:flex; justify-content:center; padding:20px; box-sizing:border-box; }
button,input,table,th,td,label,h1,h2,h3,p,div{ font-family:var(--app-font); }
.card{ background:var(--panel); width:100%; max-width:600px; border-radius:var(--radius); padding:24px; box-shadow:0 10px 30px rgba(0,0,0,0.3); border:1px solid var(--border); }
h1{ margin:0 0 10px; font-size:22px; text-align:center; } .desc{ color:var(--muted); font-size:13px; margin-bottom:20px; text-align:center; line-height:1.5; }
.quizLogoWrap{ width:162px; height:162px; border-radius:50%; overflow:hidden; margin:4px auto 18px; border:1px solid var(--border); background:rgba(255,255,255,0.06); display:flex; align-items:center; justify-content:center; }
.quizLogo{ width:100%; height:100%; object-fit:cover; display:block; }
.loginIntro{ text-align:center; }
.loginForm{ width:100%; max-width:420px; margin:0 auto; }
.loginForm label{ text-align:left; }
.loginForm input{ text-align:left; }
.reviewBox{ margin-top:20px; border-top:1px solid var(--border); padding-top:18px; }
.reviewItem{ border:1px solid var(--border); border-radius:12px; padding:14px; margin-top:12px; background:color-mix(in srgb, var(--panel) 90%, var(--primary) 10%); }
.badge{ display:inline-block; padding:4px 8px; border-radius:999px; font-size:11px; font-weight:800; margin-bottom:8px; }
.badge.ok{ background:rgba(34,197,94,.16); color:var(--primary2); }
.badge.no{ background:rgba(239,68,68,.16); color:#ef4444; }
.reviewMeta{ font-size:13px; line-height:1.55; color:var(--text); }
.reviewMeta b{ color:var(--muted); }
label{ font-size:10px; text-transform:uppercase; font-weight:bold; color:var(--muted); margin-bottom:4px; display:block; }
.loginForm label{ font-size:12px; }
.loginForm input{ padding:10px 12px; }
input{ width:100%; padding:12px; border-radius:10px; border:1px solid var(--border); background:color-mix(in srgb, var(--panel) 92%, var(--text) 8%); color:var(--text); margin-bottom:15px; box-sizing:border-box; outline:none; }
.loginForm input{ padding:10px 12px; }
.timerBox{ width:max-content; min-width:118px; margin:0 auto 14px; padding:8px 16px; border-radius:999px; background:linear-gradient(135deg, color-mix(in srgb, var(--primary) 18%, var(--panel) 82%), color-mix(in srgb, var(--primary2) 16%, var(--panel) 84%)); border:1px solid color-mix(in srgb, var(--primary) 42%, var(--border)); color:var(--primary2); font-size:17px; font-weight:800; letter-spacing:.04em; text-align:center; box-shadow:0 8px 22px rgba(0,0,0,.16); }
.timeEndNotice{ margin:0 0 16px; padding:12px 14px; border-radius:14px; background:color-mix(in srgb, #ef4444 12%, var(--panel) 88%); border:1px solid color-mix(in srgb, #ef4444 46%, var(--border)); color:var(--text); text-align:center; font-size:15px; font-weight:800; }
.btn{ background:var(--primary); color:#fff; border:none; padding:12px 20px; border-radius:10px; cursor:pointer; font-weight:800; width:100%; transition:0.2s; box-shadow:0 8px 18px rgba(0,0,0,.22); }
.btn:hover{ filter:brightness(1.1); }
.btn-back{ background:linear-gradient(135deg, var(--primary), var(--primary2)); color:#fff; border:1px solid rgba(255,255,255,.35); box-shadow:0 0 0 3px rgba(255,255,255,.10), 0 8px 22px rgba(0,0,0,.25); }
.btn-back:hover{ filter:brightness(1.18); box-shadow:0 0 0 4px rgba(255,255,255,.14), 0 10px 26px rgba(0,0,0,.30); }
.opt{ display:block; padding:14px; border:1px solid color-mix(in srgb, var(--primary) 35%, var(--border)); border-radius:10px; margin-bottom:10px; cursor:pointer; transition:0.2s; background:var(--option-bg); color:var(--text); font-weight:600; }
.opt:hover{ background:var(--option-hover); border-color:color-mix(in srgb, var(--primary) 55%, var(--border)); } .opt.active{ border-color:var(--primary); background:var(--option-active); box-shadow:0 0 0 3px color-mix(in srgb, var(--primary) 24%, transparent); }
.bar{ height:6px; background:rgba(255,255,255,0.05); border-radius:3px; margin-bottom:20px; overflow:hidden; }
.fill{ height:100%; background:var(--primary); transition:width 0.3s; }
table{ width:100%; border-collapse:collapse; margin-top:15px; font-size:12px; }
th, td{ text-align:left; padding:8px; border-bottom:1px solid var(--border); }
@media (min-width: 901px){ body{ overflow:hidden; } .card{ max-height:calc(100vh - 40px); overflow:auto; } }
.loginForm{direction:rtl;} .loginForm label,.loginForm input{text-align:right; direction:rtl;} .loginForm label{font-size:14px;} th, td{text-align:right;} b,strong,h1,h2,h3,label,.btn,.opt,.badge,.reviewMeta b{font-weight:400!important;} h2{color:var(--primary2);} .opt{color:var(--text);}
</style>

<script>
const DATA = {"title":"اختبار تفاعلي","desc":"أجب عن جميع الأسئلة ثم راجع التغذية الراجعة في النهاية.","lang":"ar","randQ":true,"randA":true,"saveData":true,"classLbl":"BAK3093","sheetUrl":"https://script.google.com/macros/s/AKfycbx5KO1kWyPCKOT2zUzvsSHGo3jXnGgyTrrlQOLs4r8xC1i0cdzPxE7l-zm64-3BdMOQZA/exec","logoUrl":"","timerMinutes":0,"hasExplanation":true,"questions":[{"q":"ما الفارق الأساسي بين مفهومي \"الكتابة\" و\"الخط\" في السياق الاصطلاحي اللغوي والجمالي؟","choices":["الكتابة هي الأسلوب الجمالي والفني لتنميق الحروف، بينما الخط هو النظام الرمزي لنقل الصوت.","الكتابة تشير إلى المدارس الخطية المتأخرة، بينما الخط يمثل مرحلة نشأة الأبجديات السامية الأولى.","الكتابة تختص بالنصوص المحفورة على الحجارة، بينما الخط يختص بالنصوص المكتوبة على الورق والبردي.","الكتابة نظام رمزي تواصلي لنقل الكلام المنطوق، بينما الخط هو الأسلوب الجمالي المعتمد على قواعد النسب والتوازن."],"answerIndex":3,"explain":"الكتابة تؤدي وظيفة نقل المعنى والتواصل بالدرجة الأولى، في حين يتجاوز الخط التوصيل الصوتي إلى البناء البصري الجمالي المنسوب.","rationales":["هذا الاختيار يعكس التعريفين؛ فالكتابة هي النظام الرمزي التواصلي، بينما الخط هو الأسلوب الفني والمقنَّن.","المدارس الخطية المتأخرة هي تطبيقات للخط العربي وليست تعريفًا لمفهوم الكتابة العام.","دراسة النصوص المحفورة على الحجارة تسمى علم النقوش (Epigraphy)، ولا يحدد ذلك الفارق المفهومي بين الكتابة والخط.","الكتابة تؤدي وظيفة نقل المعنى والتواصل بالدرجة الأولى، في حين يتجاوز الخط التوصيل الصوتي إلى البناء البصري الجمالي المنسوب."]},{"q":"ما النظرية الأكثر قبولًا في الدراسات الأكاديمية المعاصرة لعلم النقوش بشأن أصل الخط العربي؟","choices":["ابتُكر الخط العربي دفعة واحدة في مكة قبل الإسلام بقرون دون صلة بالأبجديات الإقليمية.","تطور الخط العربي تدريجيًا من الخط النبطي المتأخر، وهو ما تدعمه النقوش الانتقالية المؤرَّخة.","تطور الخط العربي بشكل مباشر ومستقل عن الأبجدية الفينيقية دون وسائط سامية.","نشأ الخط العربي كفرع مباشر ومشتق بالكامل من الخط السرياني المستخدَم في النصوص المسيحية."],"answerIndex":1,"explain":"تتفق غالبية الدراسات النقشية المعاصرة على الانتماء المباشر للسلالة النبطية-الآرامية استنادًا إلى سلسلة من النقوش الانتقالية.","rationales":["التطور الخطي لم يحدث بابتكار مفاجئ، بل عبر مسار تدريجي موثق آثارياً.","تتفق غالبية الدراسات النقشية المعاصرة على الانتماء المباشر للسلالة النبطية-الآرامية استنادًا إلى سلسلة من النقوش الانتقالية.","الأدلة الأركيولوجية تؤكد وجود وسائط سامية متسلسلة بين الفينيقية والعربية، مثل الآرامية والنبطية.","التأثير السرياني يُدرس كاحتمال مساهم أو موازٍ في سياقات معينة، لكنه ليس القول الأكثر قبولاً بشأن الأصل الرئيس."]},{"q":"ما العامل الرئيسي الذي أدى إلى ظهور \"الحروف المتصلة\" (الليغاتير) في الخط العربي وتمايزه عن أصله النبطي الرسمي؟","choices":["صدور قرارات إدارية صارمة من السلطات الرومانية بضرورة ربط الحروف العربية.","الحاجة الفنية إلى إدخال نظام نقط الإعجام ونقط الشكل لتمييز الحروف متشابهة الرسم.","التخلي التام عن استخدام الكتابة في المعاملات التجارية واقتصارها على الشؤون الدينية.","التحول من النقش الرسمي على الحجارة الصلبة إلى الكتابة السريعة على المواد اللينة كالجلد والبردي."],"answerIndex":3,"explain":"استخدام المواد اللينة في الكتابة اليومية والتجارية اقتضى سرعة تدوين الحروف وربط بعضها ببعض لتسهيل جولة القلم.","rationales":["السيطرة الرومانية على مملكة الأنباط هيأت الظروف التاريخية للتحول، لكن الربط كان نتيجة التطور الكتابي العفوي وليس بقرار إداري.","نظاما التنقيط والتشكيل ظهرا في مرحلة لاحقة في صدر الإسلام، بينما نشأت الحروف المتصلة قبل الإسلام بفترات طويلة.","التوسع في التجارة والمراسلات اليومية كان من العوامل المحفزة لتبسيط الكتابة وتسريعها، وليس التخلي عنها.","استخدام المواد اللينة في الكتابة اليومية والتجارية اقتضى سرعة تدوين الحروف وربط بعضها ببعض لتسهيل جولة القلم."]},{"q":"أيّ من النقوش التالية يُعَدّ شاهدًا بارزًا على استخدام اللغة العربية المكتوبة بأبجدية نبطية متأخرة في سياق شاهد قبر ملكي قبل الإسلام؟","choices":["نقش زبد (512م)","نقش جبل أسيس (528م)","نقش النمارة (328م)","نقش حرّان (568م)"],"answerIndex":2,"explain":"نقش النمارة المؤرخ سنة 328م هو شاهد قبر ملكي مكتوب بلغة عربية وبخط نبطي متأخر، ويُعد من أهم الشواهد الانتقالية.","rationales":["نقش زبد هو نقش ثلاثي اللغة يمثل مرحلة متقدمة من أشكال الحروف العربية.","نقش جبل أسيس يظهر خطًا عربيًا شبه مكتمل في القرن السادس الميلادي.","نقش النمارة المؤرخ سنة 328م هو شاهد قبر ملكي مكتوب بلغة عربية وبخط نبطي متأخر، ويُعد من أهم الشواهد الانتقالية.","نقش حران يمثل استخدامًا رسميًا مبكرًا للخط العربي في سياق بنائي معماري وليس شاهد قبر ملكي."]},{"q":"ما الفرق الوظيفي والتاريخي بين نظامي \"نقط الإعجام\" و\"نقط الشكل\" في مراحل إصلاح الكتابة العربية؟","choices":["نقط الإعجام ظهر في العصر العباسي على يد ابن مقلة، بينما نقط الشكل ابتكره الخليل بن أحمد في الجاهلية.","نقط الإعجام وضعه أبو الأسود الدؤلي للحركات بالنقط الملون، بينما نقط الشكل وضعه نصر بن عاصم لتمييز الباء والتاء.","نقط الإعجام يهدف إلى تمييز الحروف متشابهة الرسم (كالباء والتاء)، بينما نقط الشكل يهدف إلى تمييز الحركات القصيرة.","نقط الإعجام يُعنى بضبط قواعد النحو، بينما نقط الشكل يقتصر على القراءات القرآنية دون بقية النصوص."],"answerIndex":2,"explain":"يُستخدم نقط الإعجام للتفريق بين الحروف التي تشترك في الرسم الأساسي، بينما يختص نقط الشكل بتمثيل الفتحة والضمة والكسرة.","rationales":["كلا النظامين تطورا في القرنين الأول والثاني الهجريين، وتطوير ابن مقلة كان في التقنين الهندسي لأشكال الخطوط.","هذا الاختيار يعكس الأدوار الإسنادية؛ فأبو الأسود مرتبط بنقط الشكل (الحركات الملونة)، ونصر بن عاصم بنقط الإعجام.","يُستخدم نقط الإعجام للتفريق بين الحروف التي تشترك في الرسم الأساسي، بينما يختص نقط الشكل بتمثيل الفتحة والضمة والكسرة.","كلا النظامين استُخدما لضبط النص العربي عامة والقرآني خاصة، والتمييز بينهما وظيفي متعلق بالرسم والصوت."]},{"q":"ما النقلة النوعية التي أحدثها الخليل بن أحمد الفراهيدي في نظام تشكيل الحروف العربية مقارنة بنظام أبي الأسود الدؤلي؟","choices":["ألغى استخدام النقط كليًا واستعاض عنه بالأرقام المكتوبة فوق الحروف.","استبدل النقط الملون فوق الحروف وتحتها برموز خطية مشتقة متصلة بجسم الحرف (كالفتحة والضمة والكسرة).","نقل نظام نقط الإعجام من الحروف المتشابهة إلى الحروف المترادفة لغويًا.","ابتكر نظام التشكيل باستخدام الألوان المتعددة لكل حركة عرَضية في الجملة."],"answerIndex":1,"explain":"طوّر الفراهيدي نظام الحركات الخطية المستحدثة من أشكال الحروف المادية، مما أزال اللبس بين نقط الإعجام ونقط الشكل الملون.","rationales":["الفراهيدي لم يلغِ النقط بل طوّر رموز الحركة لتصبح أشكالاً خطية صغيرة (ألف مصغرة للفتحة، واو مصغرة للضمة... إلخ).","طوّر الفراهيدي نظام الحركات الخطية المستحدثة من أشكال الحروف المادية، مما أزال اللبس بين نقط الإعجام ونقط الشكل الملون.","نقط الإعجام ظل مخصصًا لتمييز الحروف متشابهة الرسم ولم يتدخل في المترادفات اللغوية.","نظام الألوان المتعددة كان هو النظام القديم لأبي الأسود الدؤلي، وجاء الفراهيدي ليستبدل به الرموز الخطية السوداء."]},{"q":"اعتمد ابن مقلة في تقنينه الهندسي للخط العربي (\"الخط المنسوب\") على ثلاثة معايير قياسية؛ ما وحدة القياس الأساسية التي تُشتق منها بقية المعايير؟","choices":["مساحة الورقة المستخدَمة في النسخ","الدائرة القياسية","النقطة المعينية (الرومية)","زاوية ميل القلم عند بداية كل كلمة"],"answerIndex":2,"explain":"النقطة المعينية التي يتركها سن القلم المبري هي الوحدة الأساسية القياسية التي يُقاس بها طول الألف وقطر الدائرة.","rationales":["التقنين الهندسي يعتمد على أبعاد سن القلم والنقطة وليس على حجم الورقة.","الدائرة القياسية تُستخدم لضبط استدارة الحروف المنحنية، لكن قطرها يحدده طول الألف الشارح لعدد من النقاط.","النقطة المعينية التي يتركها سن القلم المبري هي الوحدة الأساسية القياسية التي يُقاس بها طول الألف وقطر الدائرة.","زاوية القلم مهمة في الأداء الفني لكنها ليست وحدة القياس المنسوبة لأبعاد الحرف."]},{"q":"يُوصف بأنه خط زاويّ ذو طابع هندسي جامد استُخدم في المصاحف المبكرة والنقوش المعمارية؛ ما هذا الخط؟","choices":["خط الرقعة","الخط الكوفي","خط النسخ","خط الثلث"],"answerIndex":1,"explain":"الخط الكوفي هو النمط القديم الذي يتميز بالطابع الهندسي المستقيم والزاوي والاستخدام المبكر في النقوش والمعمار.","rationales":["خط الرقعة خط بسيط وسريع الكتابة ظهر في العصر العثماني للكتابة اليومية.","الخط الكوفي هو النمط القديم الذي يتميز بالطابع الهندسي المستقيم والزاوي والاستخدام المبكر في النقوش والمعمار.","خط النسخ خط مستدير وواضح وسهل القراءة طُوّر لنسخ الكتب والمصاحف لاحقًا.","خط الثلث خط كبير ومزخرف ومتداخل الحروف يُستخدم عادة في العناوين والزخارف."]},{"q":"ما التحدي التقني الرئيس الذي أدى إلى تأخر تطبيق طباعة الحروف المتحركة (Movable Type) للغة العربية مقارنة بالحروف اللاتينية؟","choices":["كثرة عدد حروف الأبجدية العربية مقارنة بالأبجديات الأوروبية.","طبيعة الحروف العربية المتصلة وتغيُّر شكل الحرف الواحد بحسب موقعه في الكلمة.","غياب المعايرة الرقمية لنظام تشفير الحروف قبل القرن التاسع عشر.","رفض الخطاطين العباسيين استخدام الورق والطباعة في نسخ الكتب."],"answerIndex":1,"explain":"تطلب تصميم حروف الطباعة العربية صناعة عدة أشكال لكل حرف (بداية، وسط، نهاية، منفرد)، وهو ما يعقد سبك الحروف المتحركة.","rationales":["عدد الحروف (28 حرفًا) ليس كبيراً بمفرده، بل المشكلة تكمن في تنوع أشكال الحرف الواحد حسب موقعه.","تطلب تصميم حروف الطباعة العربية صناعة عدة أشكال لكل حرف (بداية، وسط، نهاية، منفرد)، وهو ما يعقد سبك الحروف المتحركة.","المعايرة الرقمية تتعلق بالعصر الرقمي والكمبيوتر (كالـ Unicode)، بينما المطبعة بدأت في القرون الآلية المبكرة.","الورق استُخدم بكثرة في العصر العباسي، والتأخر كان تقنياً في ابتكار الحروف المتحركة المتصلة وليس بسبب رفض الورق."]},{"q":"لماذا تُفضل الأوساط الأكاديمية استخدام \"الصياغة التحوطية\" (Hedging) مثل \"تشير النتائج إلى احتمال...\" بدلاً من الجزم المطلق؟","choices":["التعبير عن درجة يقين واقعية تتناسب مع طبيعة البحث العلمي وتجنب التعميم غير المسنود.","للالتزام بشرط استخدام ضمائر المتكلم والتعبير عن الرأي الشخصي بحرية.","إخفاء ضعف الأدلة الميدانية وعدم قدرة الباحث على الوصول إلى استنتاج صريح.","لزيادة عدد كلمات البحث وتلبية متطلبات الطول المحددة في المقالات العلمية."],"answerIndex":0,"explain":"تساعد الصياغة التحوطية الباحث على تقديم ادعاءات معتدلة تتطابق تمامًا مع الحدود والظروف التي أُجري فيها البحث.","rationales":["تساعد الصياغة التحوطية الباحث على تقديم ادعاءات معتدلة تتطابق تمامًا مع الحدود والظروف التي أُجري فيها البحث.","الصياغة التحوطية تقترن بالموضوعية وتتجنب الرأي الشخصي المجرد أو ضمائر المتكلم المباشرة.","الصياغة التحوطية ليست محاولة لإخفاء الضعف، بل هي تعبير عن النزاهة والعملية في تقييم مدى يقين النتائج.","الغرض من التحوط دلالي ومفهومي يرتبط بالدقة العلمية، وليس لزيادة الطول اللفظي."]},{"q":"ما الوظيفة الأساسية لـ \"جملة الموضوع\" (Topic Sentence) في الفقرة الأكاديمية النموذجية؟","choices":["إيراد الاقتباس المباشر بحروفه الحرفية من المصدر العلمي الأول.","تقديم الحجة المضادة وتفنيدها قبل مناقشة الأدلة الذاتية.","تقديم التلخيص النهائي للبحث ككل وربطه بقائمة المراجع.","عرض الفكرة الرئيسة التي تسعى الفقرة إلى شرحها ودعمها بالأدلة."],"answerIndex":3,"explain":"تحدد جملة الموضوع الفكرة المحورية للفقرة، لتأتي الجمل الداعمة والدلائل والتحليلات لاحقاً لخدمتها.","rationales":["الاقتباس المباشر يعمل كدليل داخل الفقرة ولا يشترط أن يكون هو جملة الموضوع.","عرض الحجة المضادة عنصر في بناء الحجة الكاملة وقد يظهر في أجزاء مختلفة من النص وليس بالضرورة كجملة موضوع لكل فقرة.","تلخيص البحث ككل يكون في الملخص أو الخاتمة، بينما تعنى جملة الموضوع بالفقرة المحددة.","تحدد جملة الموضوع الفكرة المحورية للفقرة، لتأتي الجمل الداعمة والدلائل والتحليلات لاحقاً لخدمتها."]},{"q":"يتطلب بناء الحجة الأكاديمية المتماسكة تضمين \"الحجة المضادة\" (Counterargument)؛ ما الهدف المنهجي من ذلك؟","choices":["تشتيت قارئ البحث حتى لا يلاحظ الثغرات في الدليل التجريبي المعتمد.","إظهار الموضوعية الشاملة عبر عرض الرؤى المخالفة بأمانة ثم مناقشتها أو تفنيدها بالدليل.","التشكيك في صحة البحث الأصلي وإثبات عدم جدوى النتائج المتوصل إليها.","الانحياز التام للرأي الآخر لإرضاء محكّمي المجلات العلمية."],"answerIndex":1,"explain":"إيراد وجهة النظر المخالفة وتفنيدها بأسلوب علمي يبرهن على اتساع اطلاع الباحث وقوة حجته الرئيسة.","rationales":["الحجة الأكاديمية تسعى للوضوح الشديد واستباق الأسئلة، وليس للتشتيت والتضليل.","إيراد وجهة النظر المخالفة وتفنيدها بأسلوب علمي يبرهن على اتساع اطلاع الباحث وقوة حجته الرئيسة.","عرض الحجة المضادة لا يهدف لإبطال البحث، بل لتقويته بإظهار الشمولية والرد على الاعتراضات المحتملة.","الباحث الناقد يطرح الحجة المضادة ليرد عليها ويحدد حدود حجته، لا ليتخلى عن اطروحته."]},{"q":"أيّ المعايير التالية يُعنى بتحقيق السلطة العلمية (Authority) للمصدر عند تقييمه أكاديميًا وفق نموذج CRAAP؟","choices":["مدى ملاءمة موضوع المقال لمشكلة البحث وعينته الدراسية.","التحقق من تاريخ نشر المقال وتحديثه لضمان مواكبته لأحدث الاكتشافات.","خلوّ النص من الأخطاء الإملائية والأسلوبية المباشرة.","فحص مؤهلات المؤلف وخبرته التخصصية وانتمائه المؤسسي العلمي."],"answerIndex":3,"explain":"معيار السلطة العلمية يبحث في مصدر المعلومات ومصداقية المؤلف أو الجهة الناشرة وتخصصهم.","rationales":["هذا يرتبط بمعيار الملاءمة والفائدة الفعلية للبحث (Relevance).","هذا يعبر عن معيار الحداثة (Currency) وليس السلطة العلمية.","هذا مؤشر جزئي قد يدخل ضمن الدقة (Accuracy)، ولكنه لا يكفي لمفرده لقياس مؤهلات المؤلف العلمية.","معيار السلطة العلمية يبحث في مصدر المعلومات ومصداقية المؤلف أو الجهة الناشرة وتخصصهم."]},{"q":"كيف تختلف تقنية \"إعادة الصياغة\" (Paraphrasing) عن تقنية \"التلخيص\" (Summarization) في التعامل مع النصوص؟","choices":["إعادة الصياغة تتطلب نقل النص حرفيًا، بينما التلخيص يحول النص إلى حاشية سفلية.","إعادة الصياغة لا تتطلب توثيق المصدر، بينما التلخيص يستوجب ذكر صفحة الاقتباس دائمًا.","إعادة الصياغة تعيد التعبير عن فكرة محددة بأسلوب جديد وبطول مقارب للأصل، بينما التلخيص يكثّف نصًا طويلًا في خلاصة مركزة.","إعادة الصياغة تقتصر على المصادر الثانوية، بينما التلخيص يختص بالمصادر الأولية فقط."],"answerIndex":2,"explain":"تهدف إعادة الصياغة لترجمة التفاصيل بأسلوب الباحث دون تقليص كبير للحجم، في حين يُستعمل التلخيص لتكثيف الأفكار الرئيسة لنصوص واسعة.","rationales":["النقل الحرفي هو اقتباس مباشر، بينما تعتمد إعادة الصياغة والتلخيص كلاهما على كلمات الكاتب الخاصة.","كلا الأسلوبين ينطويان على استقاء الأفكار من مصدر آخر ويستوجبان التوثيق الأكاديمي الصارم.","تهدف إعادة الصياغة لترجمة التفاصيل بأسلوب الباحث دون تقليص كبير للحجم، في حين يُستعمل التلخيص لتكثيف الأفكار الرئيسة لنصوص واسعة.","يمكن استخدام كلتا التقنيتين مع المصادر الأولية والثانوية حسب حاجة الباحث."]},{"q":"وفقًا لنظام الجمعية الأمريكية لعلم النفس الإصدار السابع (APA 7th)، ما العناصر المكونة للتوثيق القياسي داخل النص عند الاستشهاد بفكرة أُعيدت صياغتها؟","choices":["(عنوان المقالة، اسم المجلة، سنة النشر)","(اسم المؤلف الكامل، عنوان الكتاب، رقم الصفحة)","(اسم العائلة للمؤلف، رقم المجلد، رابط الموقع)","(اسم العائلة للمؤلف، سنة النشر)"],"answerIndex":3,"explain":"في نظام APA7، يتكون الاقتباس المرجعي غير المباشر داخل المتن أساسًا من اسم عائلة المؤلف وسنة النشر.","rationales":["اسم المجلة وعنوان المقالة مكانهما التوثيقي في قائمة المراجع النهائية وليس في الاستشهاد المباشر داخل المتن.","لا يُدرج اسم المؤلف الكامل ولا عنوان الكتاب داخل المتن المباشر في APA7.","رابط الموقع ورقم المجلد يظهران فقط في قائمة المراجع في نهاية البحث.","في نظام APA7، يتكون الاقتباس المرجعي غير المباشر داخل المتن أساسًا من اسم عائلة المؤلف وسنة النشر."]},{"q":"ما التصرف الأكاديمي الصحيح إذا تعذّر على الباحث التحقق من رقم الصفحة أو التاريخ الدقيق لمصدر إلكتروني يرغب في الاستشهاد به؟","choices":["البحث عن بيانات وهمية باستخدام الذكاء الاصطناعي وتضمينها في القائمة.","ترك حقل التوثيق فارغًا بالكامل في متن النص ووضع الرابط فقط في الهامش.","اختراع رقم صفحة وتاريخ تقديري يبدوان منطقيين لتكتمل الصيغة الشكلية لـ APA7.","استخدام الصيغ المعتمدة للمعلومات المفقودة (مثل د.ت.) أو استبدال المصدر بمصدر آخر موثق فعليًا."],"answerIndex":3,"explain":"ينبغي الالتزام التام بالحقائق المتاحة وتوضيح غياب التاريخ بتعبيرات معتمدة بدلاً من اختراع أي بيانات غير محققة.","rationales":["توليد مراجع وهمية هو أحد أخطر صور سوء السلوك العلمي والهلوسة الأكاديمية.","نظام APA7 لا يستعمل الهوامش السفلية للتوثيق بل يعتمد الاستشهاد المباشر بالمتن.","اختلاق أي بيانات ببليوجرافية يُعد خرقاً أخلاقياً جسيماً للامانة الأكاديمية وتلفيقاً للبيانات.","ينبغي الالتزام التام بالحقائق المتاحة وتوضيح غياب التاريخ بتعبيرات معتمدة بدلاً من اختراع أي بيانات غير محققة."]},{"q":"ما أخطر مظاهر \"الهلوسة\" (Hallucination) التي قد تنتجها أدوات الذكاء الاصطناعي التوليدي في السياق البحثي الأكاديمي؟","choices":["إبطاء عملية القراءة الاستطلاعية للبحوث والمقالات الطويلة.","تصحيح الأخطاء النحوية والإملائية بأسلوب مفرط الرسمية.","توليد أسماء مؤلفين وعناوين كتب ومراجع علمية وهمية لا وجود لها في الواقع.","اقتراح خطة أولية للعصف الذهني وصياغة عناوين فرعية للبحث."],"answerIndex":2,"explain":"الهلوسة الأكاديمية تجعل النموذج يختلق استشهادات ومراجع تبدو صحيحة ومقنعة للغاية لكنها مزيفة كليًا.","rationales":["الذكاء الاصطناعي يُسرّع التلخيص والاستطلاع بدلاً من إبطائه.","التدقيق اللغوي هو استخدام مساعد شائع وليس مظهرًا للهولسة الناتجة عن اختلاق الحقائق.","الهلوسة الأكاديمية تجعل النموذج يختلق استشهادات ومراجع تبدو صحيحة ومقنعة للغاية لكنها مزيفة كليًا.","العصف الذهني من الاستخدامات المساعدة المشروعة متى ما خضعت للمراجعة النقدية والتوجيه البشري."]},{"q":"في عملية إنتاج النص الأكاديمي المكونة من 12 خطوة، متى ينبغي للكاتب إدراج الاقتباسات وتوثيق المراجع؟","choices":["قبل البدء في صياغة سؤال البحث وتحديد موضوعه.","فقط عندما يطلب المحكم أو الأستاذ إضافة قائمة المراجع.","في مرحلة تدوين المسودة الأولى وأثناء عملية الكتابة نفسها.","بعد الانتهاء التام من تدقيق المسودة النهائية إملائيًا ولغويًا."],"answerIndex":2,"explain":"يجب تسجيل الاستشهادات والمصادر لحظة صياغة الأفكار والملاحظات لضمان نسبة كل فكرة لصاحبها بدقة.","rationales":["تحديد سؤال البحث والموضوع يسبق جمع المصادر وقراءتها وتوثيقها.","التوثيق شرط أسياسي أصيل في الكتابة الأكاديمية منذ البداية وليس خياراً شكلياً مؤجلاً.","يجب تسجيل الاستشهادات والمصادر لحظة صياغة الأفكار والملاحظات لضمان نسبة كل فكرة لصاحبها بدقة.","تأجيل التوثيق للنهاية يؤدي بنسبة كبيرة إلى نسيان المصادر والوقوع في الانتحال غير المقصود."]},{"q":"وفقًا للمركز الدولي للنزاهة الأكاديمية (ICAI)، ما القيمة الجوهرية التي تُعنى بـ \"تحمُّل الفرد للنتائج المترتبة على قراراته وأعماله الأكاديمية\"؟","choices":["الثقة (Trust)","المسؤولية (Responsibility)","العدالة (Fairness)","الشجاعة (Courage)"],"answerIndex":1,"explain":"المسؤولية تأخذ بعد تقبل الفرد لتبعات أفعاله وقراراته الأخلاقية والأكاديمية والالتزام بواجباته.","rationales":["الثقة ترتبط بتهيئة بيئة آمنة تعتمد على صدق نتائج الآخرين وأعمالهم.","المسؤولية تأخذ بعد تقبل الفرد لتبعات أفعاله وقراراته الأخلاقية والأكاديمية والالتزام بواجباته.","العدالة تتصل بتطبيق المعايير المعرفية والتقييمية نفسها على الجميع دون تمييز.","الشجاعة تشير إلى الدفاع عن قيم النزاهة والعمل بها حتى في المواقف الصعبة."]},{"q":"أيّ من المصطلحات التالية يُعبر عن المخالفة الأكاديمية المتمثلة في \"تكليف طرف ثالث (سواء كان شخصًا أم خدمة) بإنجاز العمل الأكاديمي مقابل أجر مالي\"؟","choices":["التزييف (Falsification)","الغش التعاقدي (Contract Cheating)","التلفيق (Fabrication)","التواطؤ (Collusion)"],"answerIndex":1,"explain":"الغش التعاقدي ينطوي على الاستعانة بطرف خارجي لإعداد الواجبات أو الأبحاث بمقابل مادي أو غير مادي ثم تسليمها باسم الطالب.","rationales":["التزييف هو التلاعب بالبيانات أو الأدوات الميدانية والتغيير في النتائج الحقيقية للبحث.","الغش التعاقدي ينطوي على الاستعانة بطرف خارجي لإعداد الواجبات أو الأبحاث بمقابل مادي أو غير مادي ثم تسليمها باسم الطالب.","التلفيق هو اختلاق بيانات أو نتائج أو تجارب لم تُجرَ من الأساس.","التواطؤ هو التعاون السرّي غير المصرَّح به بين طالبين أو أكثر في تكليف يُفترض فيه العمل الفردي."]},{"q":"لماذا يُعَدّ \"الانتحال الفسيفسائي\" (Patchwriting) مخالِفًا للنزاهة الأكاديمية حتى وإن قام الطالب بتغيير بعض الكلمات بمرادفات مختلفة؟","choices":["لأنه يُصنف كغش تعاقدي مدفوع الأجر.","لأن استبدال الكلمات بمرادفات مسموح به فقط في العلوم الطبيعية دون الإنسانية.","لأنه يُبقي على البنية النحوية والترتيب المنطقي للجمل الأصلية دون إعادة صياغة جذرية أو توثيق أصيل.","لأنه يمنع برامج كشف التشابه من إعطاء نسبة تشابه مرتفعة."],"answerIndex":2,"explain":"استبدال المفردات مع الحفاظ على هيكل الجملة الأصلية يُعد تضليلًا، إذ لم يقم الكاتب ببناء النص بأسلوب فكري مستقل.","rationales":["الانتحال الفسيفسائي يحدث بأسلوب الكاتب في تعديل النص ولا يرتبط بالضرورة بشراء الأبحاث.","قواعد التوثيق وإعادة الصياغة الجوهرية تطبق بنفس المبادئ الصارمة عبر التخصصات الأكاديمية كافة.","استبدال المفردات مع الحفاظ على هيكل الجملة الأصلية يُعد تضليلًا، إذ لم يقم الكاتب ببناء النص بأسلوب فكري مستقل.","السبب الأخلاقي يرجع للإخلال بالأصالة والملكية الفكرية وليس فقط بالتحايل على خوارزميات الفحص."]},{"q":"متى يُصبح إعادة استخدام الباحث لعمله الشخصي السابق مخالفة أُكاديمية تُعرف بـ \"الانتحال الذاتي\"؟","choices":["عندما يقدم بحثًا سابقًا كليًا أو جزئيًا لتكليف جديد دون إفصاح أو الحصول على موافقة مسبقة.","عندما يستشهد بجدول بياني من نشر سابق له شريطة الإشارة إلى المقال الأول.","عندما يعيد استخدام جزئيات من أبحاثه السابقة مع الإفصاح الصريح والتوثيق المباشر.","عندما يترجم أفكاره الخاصة المنشورة باللغة العربية إلى اللغة الإنجليزية."],"answerIndex":0,"explain":"يقع الانتحال الذاتي عند خداع المقيّم بتقديم عمل قديم بوصفه إنتاجًا جديدًا وأصيلًا مخصصًا للتكليف الحالي.","rationales":["يقع الانتحال الذاتي عند خداع المقيّم بتقديم عمل قديم بوصفه إنتاجًا جديدًا وأصيلًا مخصصًا للتكليف الحالي.","الاستشهاد التوثيقي بالنشر السابق يعتبر ممارسة مقبولة قائمة على الإفصاح.","الإفصاح والتوثيق يمنحان الممارسة شرعيتها ويخرجانها من نطاق الانتحال الذاتي.","الترجمة الذاتية للأفكار المنشورة ليست انتحالاً ذاتيًا بشرط الإفصاح عن المرجع المترجَم منه."]},{"q":"أيّ من البيانات والتصريحات التالية يُستثنى من شرط التوثيق العلمي بوصفه \"معرفة عامة\" (Common Knowledge)؟","choices":["نتيجة استطلاع رأي ميداني أجري على 500 طالب في جامعة معينة.","حقيقة شائعة ومسلّم بها مثل القول بأن \"بغداد عاصمة الجمهورية العراقية\".","تحليل اقتصادي خاص بباحث محدد حول أسباب التضخم في العصر الحديث.","نسبة مئوية إحصائية دقيقة منشورة في تقرير منظمات دولية حديث."],"answerIndex":1,"explain":"الحقائق الجغرافية والتاريخية المقطوع بها والمتداولة على نطاق واسع بين العامة تُعفى من التوثيق المرجعي.","rationales":["نتائج الاستطلاعات بيانات خاصة ومحددة تستلزم الإسناد والتوثيق.","الحقائق الجغرافية والتاريخية المقطوع بها والمتداولة على نطاق واسع بين العامة تُعفى من التوثيق المرجعي.","التفسيرات والتحليلات الخاصة تعبر عن آراء ومساهمات فكرية لباحثين محددين ويجب نسبتها إليهم.","الأرقام الإحصائية المحددة تتطلب دائمًا توثيق المصادر التي قامت بجمعها ونشرها."]},{"q":"إذا أظهر تقرير برنامج كشف التشابه (مثل Turnitin) نسبة تشابه قدرها 25%، فما التفسير المنهجي الصحيح لهذه النتيجة؟","choices":["دليل على خلو البحث من الانتحال الفسيفسائي وأن جميع المصادر ممتازة.","إثبات قاطع بأن النص مُنتحَل بالكامل ويجب إلغاء البحث فورًا.","النسبة تعني أن الباحث استخدم الذكاء الاصطناعي لكتابة ربع المقال.","النسبة الرقمية مجرد أداة مساعدة تتطلب فحصًا بشريًا لسياق النص لتمييز الاقتباسات الموثقة والمصطلحات الشائعة عن الانتحال الفعلي."],"answerIndex":3,"explain":"برامج كشف التشابه تطابق النصوص لفظياً فقط، والقرار النهائي يتطلّب مراجعة نقدية بشرية من الأستاذ أو اللجنة المختصة.","rationales":["وجود نسبة 25% لا ينفي ولا يثبت جودة المصادر أو وجود انتحال فسيفسائي دون فحص السياق المكتوب.","النسبة الرقمية المرتفعة قد تنشأ عن مصطلحات تقنية أو اقتباسات موثقة ومراجع، ولا تعني بالضرورة وجود انتحال أخلاقي.","تقارير التشابه التقليدية تفحص المطابقة مع قواعد البيانات النصية المسبقة ولا تقيس نسبة توليد الذكاء الاصطناعي بشكل مباشر.","برامج كشف التشابه تطابق النصوص لفظياً فقط، والقرار النهائي يتطلّب مراجعة نقدية بشرية من الأستاذ أو اللجنة المختصة."]},{"q":"ما المبدأ الأساس الذي يُحدد مشروعية استخدام أدوات الذكاء الاصطناعي التوليدي في إعداد التكاليف الأكاديمية؟","choices":["حرية الاستخدام الكامل في كل الأوقات بشرط عدم كشف الأداة عبر البرامج الآلية.","منع جميع أدوات الذكاء الاصطناعي حتى تلك المتعلقة بالتدقيق الإملائي في جميع الجامعات عالميًا.","جواز توليد الفقرات الكاملة بشرط إعادة صياغتها بمرادفات جديدة لاحقًا.","الالتزام التام بسياسة المؤسسة أو المقرر التعليمي والإفصاح الصريح عن طبيعة الاستخدام."],"answerIndex":3,"explain":"تختلف السياسات بين الأقسام والجامعات؛ لذا فإن الإفصاح الصريح والامتثال للتعليمات المحددة هو المعيار الأخلاقي الحاكم.","rationales":["الاستخدام السري دون النظر للتعليمات يخالف مبادئ النزاهة والشفافية الأكاديمية.","كثير من المؤسسات تسمح بالاستخدام المساعد للذكاء الاصطناعي (كالتحرير والمراجعة) وفق سياسات واضحة.","توليد فقرات كلياً ونسبتها للذات يعتبر إخلالاً بأصالة العمل حتى لو أُعيدت صياغتها.","تختلف السياسات بين الأقسام والجامعات؛ لذا فإن الإفصاح الصريح والامتثال للتعليمات المحددة هو المعيار الأخلاقي الحاكم."]},{"q":"ما الخطوة الأولى والأهم في الدليل العملي لإعادة الصياغة الصحيحة لتجنب الوقوع في الانتحال غير المقصود؟","choices":["قراءة النص الأصلي بتمعّن حتى استيعاب فكرته الجوهرية ثم إغلاقه قبل الكتابة بالأسلوب الخاص.","فتح النص الأصلي والبدء باستبدال كل اسم بمرادفه فورًا.","نقل النص حرفيًا بين علامتي تنصيص ثم حذف العلامات في المسودة الثانية.","استخدام أداة ذكاء اصطناعي لإعادة ترتيب كلمات الفقرة دون قراءتها."],"answerIndex":0,"explain":"تنحية النص const UI = {"name":"الاسم الكامل","class":"BAK3093","start":"ابدأ الاختبار","next":"التالي","back":"رجوع","finish":"إنهاء","retake":"إعادة الاختبار","rank":"أفضل 10 نتائج","saving":"جارٍ حفظ البيانات...","result":"النتيجة","q":"س","tableName":"الاسم","tableClass":"BAK3093","percent":"%","alertInfo":"يرجى إدخال المعلومات.","alertChoose":"يرجى اختيار إجابة.","review":"مراجعة الإجابات","questionLabel":"السؤال","answerLabel":"الإجابة","explanationLabel":"الشرح","correct":"صحيح","incorrect":"غير صحيح","feedbackCorrect":"الإجابة صحيحة، لا توجد ملاحظات.","feedbackWrong":"الإجابة لا توافق الفكرة الأساسية.","noRefNote":"لم يتم العثور على شرح في ملف الأسئلة المرفوع.","timeEnd":"انتهى الوقت"};
let state = { mode:'login', idx:0, ans:[], name:'', class:'', qs:[], loading:false, ranking:[], endTime:0, remaining:0, timeEnded:false };
let timerInterval = null;
function esc(v){ return String(v ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function formatTime(ms){ const total = Math.max(0, Math.ceil(ms/1000)); const m = Math.floor(total/60); const s = total % 60; return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0'); }
function startTimer(){ if(timerInterval) clearInterval(timerInterval); if(!DATA.timerMinutes) return; state.endTime = Date.now() + DATA.timerMinutes * 60000; timerInterval = setInterval(() => { state.remaining = state.endTime - Date.now(); if(state.remaining <= 0){ clearInterval(timerInterval); timerInterval = null; state.timeEnded = true; finish(); } else if(state.mode === 'quiz') { const el = document.getElementById('timerBox'); if(el) el.textContent = formatTime(state.remaining); } }, 1000); }
function timerHtml(){ return DATA.timerMinutes && state.mode === 'quiz' ? '<div class="timerBox" id="timerBox">' + formatTime(state.endTime - Date.now()) + '</div>' : ''; }
function buildReview(){
  return '<div class="reviewBox"><h3 style="text-align:center; margin:0 0 12px;">' + UI.review + '</h3>' +
    state.qs.map((q,i) => {
      const picked = state.ans[i];
      const ok = picked === q.answerIndex;
      const userAns = picked === null || picked === undefined ? '-' : q.choices[picked];
      const selectedRationale = q.rationales && picked !== null && picked !== undefined ? q.rationales[picked] : "";
      const correctRationale = q.rationales ? q.rationales[q.answerIndex] : "";
      const fb = selectedRationale || correctRationale || q.explain || (ok ? UI.feedbackCorrect : UI.feedbackWrong + " " + UI.noRefNote);
      return '<div class="reviewItem">' +
        '<span class="badge ' + (ok ? 'ok' : 'no') + '">' + (ok ? UI.correct : UI.incorrect) + '</span>' +
        '<div class="reviewMeta"><b>' + UI.questionLabel + ':</b> ' + esc(q.q) + '</div>' +
        '<div class="reviewMeta"><b>' + UI.answerLabel + ':</b> ' + esc(userAns) + '</div>' +
        '<div class="reviewMeta"><b>' + UI.explanationLabel + ':</b> ' + esc(fb) + '</div>' +
      '</div>';
    }).join('') + '</div>';
}

function render(){
  const app = document.getElementById('app');
  if(state.mode==='login'){
    const logoHtml = DATA.logoUrl ? '<div class="quizLogoWrap"><img class="quizLogo" src="' + esc(DATA.logoUrl) + '" alt="Logo"></div>' : '';
    app.innerHTML = '<div class="loginIntro">' + logoHtml + '<h1>' + DATA.title + '</h1><p class="desc">' + DATA.desc + '</p></div>' +
      '<div class="loginForm"><label>' + UI.name + '</label><input type="text" id="u_name" value="' + esc(state.name) + '">' +
      '<label>' + UI.class + '</label><input type="text" id="u_class" value="' + esc(state.class) + '">' +
      '<button class="btn" onclick="start()">' + UI.start + '</button></div>';
  } else if(state.mode==='quiz'){
    const q = state.qs[state.idx];
    const backBtn = state.idx > 0 ? '<button class="btn btn-back" style="margin-top:10px;" onclick="back()">' + UI.back + '</button>' : '';
    const finishBtn = state.idx === state.qs.length - 1 ? '<button class="btn" style="margin-top:10px;" onclick="next()">' + UI.finish + '</button>' : '';
    app.innerHTML = timerHtml() + '<div class="bar"><div class="fill" style="width:' + ((state.idx)/state.qs.length)*100 + '%"></div></div>' +
      '<div style="font-size:11px; color:var(--muted); margin-bottom:10px;">' + UI.q + ' ' + (state.idx+1) + ' / ' + state.qs.length + '</div>' +
      '<h2 style="font-size:17px; margin-bottom:20px;">' + q.q + '</h2>' +
      q.choices.map((c,i) => '<div class="opt ' + (state.ans[state.idx]===i?'active':'') + '" onclick="setAns(' + i + ')">' + c + '</div>').join('') +
      finishBtn + backBtn;
  } else if(state.mode==='result'){
    let score = state.ans.reduce((acc, a, i) => acc + (a === state.qs[i].answerIndex ? 1 : 0), 0);
    let pct = Math.round((score/state.qs.length)*100);
    let html = '<h1>' + UI.result + '</h1>' + (state.timeEnded ? '<div class="timeEndNotice">' + UI.timeEnd + '</div>' : '') + '<div style="font-size:48px; font-weight:900; color:var(--primary2);">' + pct + '% (' + score + '/' + state.qs.length + ')</div>';
    html += buildReview();
    if(DATA.saveData){
      html += '<div style="margin-top:20px; border-top:1px solid var(--border); padding-top:20px;"><h3 style="text-align:center;">' + UI.rank + '</h3>';
      if(state.loading) html += '<p>' + UI.saving + '</p>';
      else if(state.ranking.length > 0) {
        html += '<table><tr><th>#</th><th>' + UI.tableName + '</th><th>' + UI.tableClass + '</th><th>' + UI.percent + '</th></tr>' + 
          state.ranking.map((r,i) => '<tr><td>' + (i+1) + '</td><td>' + esc(r.name) + '</td><td>' + esc(r.class) + '</td><td>' + esc(r.percent) + '</td></tr>').join('') + '</table>';
      }
      html += '</div>';
    }
    html += '<button class="btn" style="margin-top:20px;" onclick="location.reload()">' + UI.retake + '</button>';
    app.innerHTML = html;
  }
  if (window.MathJax && window.MathJax.typeset) window.MathJax.typeset();
}
function start(){
  state.name = document.getElementById('u_name').value.trim(); 
  state.class = document.getElementById('u_class').value.trim();
  if(!state.name || !state.class) return alert(UI.alertInfo);
  state.qs = JSON.parse(JSON.stringify(DATA.questions));
  if(DATA.randQ) state.qs.sort(() => Math.random()-0.5);
  if(DATA.randA) state.qs.forEach(q => {
    const originalCorrect = q.choices[q.answerIndex];
    const rationales = Array.isArray(q.rationales) ? q.rationales : [];
    const pairs = q.choices.map((choice, idx) => ({ choice, rationale: rationales[idx] || "" }));
    pairs.sort(() => Math.random()-0.5);
    q.choices = pairs.map(p => p.choice);
    q.rationales = pairs.map(p => p.rationale);
    q.answerIndex = q.choices.indexOf(originalCorrect);
  });
  state.ans = new Array(state.qs.length).fill(null);
  state.timeEnded = false;
  state.mode = 'quiz'; startTimer(); render();
}
function setAns(i){ state.ans[state.idx] = i; if(state.idx < state.qs.length - 1){ state.idx++; } render(); }
function back(){ if(state.idx > 0){ state.idx--; render(); } }
function next(){
  if(state.ans[state.idx]===null) return alert(UI.alertChoose);
  if(state.idx < state.qs.length - 1){ state.idx++; render(); }
  else { finish(); }
}
async function finish(){
  if(timerInterval){ clearInterval(timerInterval); timerInterval = null; }
  state.mode = 'result'; render();
  if(DATA.saveData && DATA.sheetUrl){
    state.loading = true; render();
    let score = state.ans.reduce((acc, a, i) => acc + (a === state.qs[i].answerIndex ? 1 : 0), 0);
    let pct = Math.round((score/state.qs.length)*100);
    try {
      await fetch(DATA.sheetUrl, { method:'POST', body: JSON.stringify({name:state.name, class:state.class, score:score, percent:pct}), mode:'no-cors' });
      setTimeout(async () => {
        try { const res = await fetch(DATA.sheetUrl); state.ranking = await res.json(); render(); } catch(e){}
        state.loading = false; render();
      }, 1500);
    } catch(e){ state.loading = false; render(); }
  }
}
render();
</script>
</body></html>
